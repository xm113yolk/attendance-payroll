name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q attendance_payroll_android_project.zip -d project

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" -name gradlew -type f -print -quit | sed 's#/gradlew$##')

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: لم يتم العثور على ملف gradlew"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "تم العثور على المشروع في: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: لم يتم العثور على APK"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          cp "$APK" output/app-debug.apk
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-payroll-apk
          path: output/app-debug.apk
